tags: 
  -  Auth
summary: Reset user password
operationId: resetUserPassword
description: "Resets user password"
security: []
requestBody: 
  required: true
  content: 
    application/json:
      schema: 
        type: object
        required: 
          - password
          - token
        properties: 
          password:
            type: string
            example: newStrongPassword123
          token:
            type: string
            example: 65ca67e7ae7f10c88b598384...
responses: 
  "200":
    description: Password was successfully reset
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password was successfully reset
            data:
              type: object
  "404":
    description: User not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: User not found!
  "401":
    $ref: ../../../components/responses/401.yaml
  