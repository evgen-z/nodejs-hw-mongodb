tags: 
  - Contacts
summary: Delete contact
operationId: deleteContact
description: "Delete contact"
security: 
  -  bearerAuth: []
parameters: 
  - in: path
    name: id
    required: true
    schema:
     type: string
     example: 6820368928e593f4026c6845
responses: 
  "204":
    description: Contact was successfully deleted
  "404":
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found!
  "401":
    $ref: "../../../components/responses/401.yaml"