tags:
  - Contacts
summary: Edit contact
operationId: patchContact
description: "Edits existing contact"
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 6820368928e593f4026c6845
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: "John Doe"
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: "+456238742344"
          email:
            description: "Contact's email address"
            type: string
            example: "example@gg.com"
          isFavourite:
            description: "Is the contact in user's favourite list"
            type: boolean
            example: false
          contactType:
            description: "Contact's type"
            type: string
            enum: ["work", "home", "personal"]
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  "200":
    description: Contact patched successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  "404":
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found!
  "401":
    $ref: "../../../components/responses/401.yaml"